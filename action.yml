name: gitconfig
description: |
  Pure-shell git config setup — global scope only. No Node.js, no x-cmd needed.
  Writes to ~/.gitconfig (the runner's global config). Position-independent:
  does not depend on cwd or any specific repo.

  For repo-scoped config (signing keys, custom identity, etc. for one
  checkout only), use the `local-config` input on `x-cmd-action/checkout`
  or `x-cmd-action/this-repo` instead — that input writes to a specific
  repo's .git/config.

inputs:
  name:
    description: 'git user.name (applied with --global). Skipped when config is set.'
    required: false
    default: 'github-actions[bot]'
  email:
    description: 'git user.email (applied with --global). Skipped when config is set.'
    required: false
    default: 'github-actions[bot]@users.noreply.github.com'
  hooks-path:
    description: |
      Path to a directory of git hook scripts (pre-commit, commit-msg, etc.).
      Sets core.hooksPath globally. Use this on Git < 2.54 or when you have
      existing script-based hooks. Skipped when config is set.
    required: false
  config:
    description: |
      Path to a .gitconfig file. When set, added as [include] in ~/.gitconfig.
      Existing global config is preserved (git's native include merge).
      On Git 2.54+, inline [hook "name"] stanzas work here too.
      When config is set, name / email / hooks-path are skipped.
    required: false

runs:
  using: composite
  steps:
    - name: apply git config
      shell: bash
      env:
        INPUT_NAME: ${{ inputs.name }}
        INPUT_EMAIL: ${{ inputs.email }}
        INPUT_HOOKS_PATH: ${{ inputs.hooks-path }}
        INPUT_CONFIG: ${{ inputs.config }}
        GITHUB_ACTION_PATH: ${{ github.action_path }}
      run: |
        # Convert action_path to POSIX on Windows (cygpath -u is available
        # in Git Bash). Without this, the backslash-separated Windows
        # path is mangled by bash's escape handling.
        if command -v cygpath >/dev/null 2>&1; then
          ACTION_PATH=$(cygpath -u "$GITHUB_ACTION_PATH")
        else
          ACTION_PATH="$GITHUB_ACTION_PATH"
        fi
        bash "$ACTION_PATH/lib/gitconfig.sh"