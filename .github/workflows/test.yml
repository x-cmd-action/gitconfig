name: test-gitconfig
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: default — name + email set globally
        uses: x-cmd-action/gitconfig@v1

      - name: verify global config
        shell: bash
        run: |
          test "$(git config --global user.name)" = "github-actions[bot]" && echo "OK: default name set"
          test "$(git config --global user.email)" = "github-actions[bot]@users.noreply.github.com" && echo "OK: default email set"

      - name: custom name/email overrides defaults
        uses: x-cmd-action/gitconfig@v1
        with:
          name: custom-bot
          email: custom@example.com

      - name: verify custom values
        shell: bash
        run: |
          test "$(git config --global user.name)" = "custom-bot" && echo "OK: custom name applied"
          test "$(git config --global user.email)" = "custom@example.com" && echo "OK: custom email applied"

      - name: config file is included via include.path (does not override earlier keys)
        uses: x-cmd-action/gitconfig@v1
        with:
          config: ${{ github.workspace }}/.github/workflows/test.gitconfig

      - name: verify earlier name/email still wins (include appends, not replaces)
        shell: bash
        run: |
          # Earlier custom-bot/custom@example.com still wins — include.path adds
          # the file as a source but does not override keys already set in ~/.gitconfig.
          test "$(git config --global user.name)" = "custom-bot" && echo "OK: earlier custom name still in effect"
          test "$(git config --global user.email)" = "custom@example.com" && echo "OK: earlier custom email still in effect"

      - name: config file applied cleanly on a fresh HOME (no prior ~/.gitconfig)
        env:
          HOME: /tmp/empty-home-${{ github.run_id }}
          INPUT_CONFIG: ${{ github.workspace }}/.github/workflows/test.gitconfig
        run: |
          rm -rf "$HOME"
          mkdir -p "$HOME"
          echo "=== fresh HOME = $HOME ==="
          # Composite actions unpack under /home/runner/work/_actions/<repo>/<ref>/
          # The same path the action itself uses via ${{ github.action_path }}.
          SCRIPT="/home/runner/work/_actions/x-cmd-action/gitconfig/main/lib/gitconfig.sh"
          if [ ! -f "$SCRIPT" ]; then
            echo "ERROR: gitconfig.sh not at expected runner path: $SCRIPT"
            # Probe the real location for diagnostics
            find /home/runner/work/_actions/x-cmd-action -name "gitconfig.sh" 2>/dev/null || true
            exit 1
          fi
          bash "$SCRIPT"
          test "$(git config --global user.name)" = "file-bot" && echo "OK: file-based name applied on fresh HOME"
          test "$(git config --global user.email)" = "file@example.com" && echo "OK: file-based email applied on fresh HOME"

      - name: hooks-path sets core.hooksPath globally
        uses: x-cmd-action/gitconfig@v1
        with:
          hooks-path: ${{ github.workspace }}/.github/workflows/test-hooks

      - name: verify hooks-path applied
        shell: bash
        run: |
          test "$(git config --global core.hooksPath)" = "${{ github.workspace }}/.github/workflows/test-hooks" && echo "OK: core.hooksPath applied globally"